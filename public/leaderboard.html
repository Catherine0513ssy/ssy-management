<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>排行榜 - SSY英语学习管理系统</title>
  <link rel="stylesheet" href="/css/candy-theme.css">
  <script defer src="/alpinejs/cdn.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-primary);
    }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; margin-bottom: 16px;
      background: var(--card-bg); backdrop-filter: var(--card-blur);
      border-radius: var(--card-radius); border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
    }
    .top-bar h1 {
      font-size: var(--text-xl); font-weight: 700;
      background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .back-btn {
      padding: 8px 16px; border-radius: 24px;
      background: var(--gradient-primary); color: white;
      font-size: var(--text-sm); font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
    }

    .class-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .class-tab {
      padding: 8px 20px; border-radius: 24px; border: none;
      font-size: var(--text-sm); font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .class-tab.active { background: var(--gradient-primary); color: white; box-shadow: 0 3px 12px rgba(99,102,241,0.35); }
    .class-tab:not(.active) { background: rgba(0,0,0,0.05); color: var(--text-secondary); }

    .type-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .type-tab {
      padding: 6px 14px; border-radius: 20px; border: none;
      font-size: var(--text-xs); font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .type-tab.active { background: linear-gradient(135deg, #fb923c, #f97316); color: white; }
    .type-tab:not(.active) { background: rgba(0,0,0,0.05); color: var(--text-secondary); }

    .card {
      background: var(--card-bg); backdrop-filter: var(--card-blur);
      border-radius: var(--card-radius); border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow); padding: 16px; margin-bottom: 16px;
    }

    /* Tier distribution */
    .tier-dist { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tier-pill {
      padding: 6px 12px; border-radius: 16px; font-size: var(--text-xs); font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }

    /* Rank items */
    .rank-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border-radius: var(--card-radius-sm);
      margin-bottom: 8px; background: rgba(255,255,255,0.5);
      transition: transform 0.15s;
    }
    .rank-item:hover { transform: translateX(4px); }
    .rank-num {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: var(--text-sm); flex-shrink: 0;
    }
    .rank-1 { background: linear-gradient(135deg, #FFD700, #FF6B35); color: white; box-shadow: 0 2px 8px rgba(255,107,53,0.3); }
    .rank-2 { background: linear-gradient(135deg, #E8F4F8, #7FB3D5); color: #4a7a9a; box-shadow: 0 2px 8px rgba(127,179,213,0.3); }
    .rank-3 { background: linear-gradient(135deg, #CD7F32, #B87333); color: white; box-shadow: 0 2px 8px rgba(184,115,51,0.3); }
    .rank-other { background: rgba(0,0,0,0.06); color: var(--text-secondary); }

    .rank-info { flex: 1; }
    .rank-name { font-weight: 700; font-size: var(--text-base); }
    .rank-tier {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 700; margin-left: 6px;
    }
    .rank-detail { font-size: var(--text-xs); color: var(--text-secondary); margin-top: 2px; }
    .rank-score {
      font-weight: 800; font-size: var(--text-lg);
      text-align: right; min-width: 50px;
    }
    .rank-score .pts { font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); }

    .progress-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 700;
    }
    .progress-up { background: rgba(34,197,94,0.15); color: #16a34a; }
    .progress-down { background: rgba(239,68,68,0.15); color: #dc2626; }

    .loading { text-align: center; padding: 40px; color: var(--text-tertiary); }
    .empty { text-align: center; padding: 20px; color: var(--text-tertiary); font-size: var(--text-sm); }

    .my-rank {
      position: sticky; bottom: 0;
      background: var(--card-bg); backdrop-filter: var(--card-blur);
      border: 2px solid var(--accent-lavender);
      box-shadow: 0 -4px 20px rgba(99,102,241,0.2);
    }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body x-data="leaderboardApp()" x-init="init()">
  <div class="container">
    <!-- Header -->
    <div class="top-bar">
      <a href="/analysis.html" class="back-btn">返回</a>
      <h1>排行榜</h1>
      <div style="width: 60px;"></div>
    </div>

    <!-- Class Tabs -->
    <div class="class-tabs">
      <button class="class-tab" :class="{ active: classId === 1 }" @click="classId = 1; load()">2313班</button>
      <button class="class-tab" :class="{ active: classId === 2 }" @click="classId = 2; load()">2314班</button>
    </div>

    <!-- Type Tabs -->
    <div class="type-tabs">
      <button class="type-tab" :class="{ active: type === 'total' }" @click="type = 'total'; load()">总分榜</button>
      <button class="type-tab" :class="{ active: type === 'progress' }" @click="type = 'progress'; load()">进步榜</button>
      <button class="type-tab" :class="{ active: type === 'vocabulary' }" @click="type = 'vocabulary'; load()">词汇榜</button>
      <button class="type-tab" :class="{ active: type === 'writing' }" @click="type = 'writing'; load()">写作榜</button>
      <button class="type-tab" :class="{ active: type === 'discipline' }" @click="type = 'discipline'; load()">纪律榜</button>
      <button class="type-tab" :class="{ active: type === 'engagement' }" @click="type = 'engagement'; load()">参与榜</button>
      <button class="type-tab" :class="{ active: type === 'streak' }" @click="type = 'streak'; load()">连胜榜</button>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="loading">加载中...</div>

    <!-- Content -->
    <div x-show="!loading">
      <!-- Tier Distribution (only for total) -->
      <div x-show="type === 'total' && tierDist" class="tier-dist">
        <template x-for="(count, tierName) in tierDist" :key="tierName">
          <div class="tier-pill" :style="getTierStyle(tierName)">
            <span x-text="tierName"></span>
            <span x-text="count + '人'"></span>
          </div>
        </template>
      </div>

      <!-- Leaderboard List -->
      <div class="card">
        <div x-show="leaderboard.length === 0" class="empty">暂无数据</div>
        <template x-for="item in leaderboard" :key="item.name">
          <div class="rank-item" :class="{ 'my-rank': item.name === myName }" @click="goProfile(item.name)">
            <div class="rank-num"
              :class="{ 'rank-1': item.rank === 1, 'rank-2': item.rank === 2, 'rank-3': item.rank === 3, 'rank-other': item.rank > 3 }"
              x-text="item.rank">
            </div>
            <div class="rank-info">
              <div>
                <span class="rank-name" x-text="item.name"></span>
                <span class="rank-tier" :style="getTierPillStyle(item.tier)" x-text="item.tier.name"></span>
              </div>
              <div class="rank-detail">
                <span x-show="type === 'total'" x-text="'词'+item.vocabulary+' 写'+item.writing+' 纪'+item.discipline+' 参'+item.engagement+' 进'+item.progress"></span>
                <span x-show="type === 'progress'" x-text="(item.improvement_pct >= 0 ? '+' : '') + item.improvement_pct + '% 提升'"></span>
                <span x-show="type === 'streak'" x-text="'连续'+item.streak+'天全勤'"></span>
              </div>
            </div>
            <div class="rank-score">
              <div x-text="item.total"></div>
              <div class="pts" x-text="type === 'progress' ? '提升' : '分'"></div>
            </div>
          </div>
        </template>
      </div>

      <!-- Class Average -->
      <div x-show="avgScore && type === 'total'" class="card">
        <div style="font-size: var(--text-sm); font-weight: 700; margin-bottom: 12px;">班级平均</div>
        <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center;">
          <div>
            <div style="font-size: var(--text-2xl); font-weight: 800; color: #a78bfa;" x-text="avgScore.vocabulary"></div>
            <div style="font-size: var(--text-xs); color: var(--text-secondary);">词汇力</div>
          </div>
          <div>
            <div style="font-size: var(--text-2xl); font-weight: 800; color: #fb923c;" x-text="avgScore.writing"></div>
            <div style="font-size: var(--text-xs); color: var(--text-secondary);">写作力</div>
          </div>
          <div>
            <div style="font-size: var(--text-2xl); font-weight: 800; color: #22c55e;" x-text="avgScore.discipline"></div>
            <div style="font-size: var(--text-xs); color: var(--text-secondary);">纪律性</div>
          </div>
          <div>
            <div style="font-size: var(--text-2xl); font-weight: 800; color: #60a5fa;" x-text="avgScore.engagement"></div>
            <div style="font-size: var(--text-xs); color: var(--text-secondary);">参与度</div>
          </div>
          <div>
            <div style="font-size: var(--text-2xl); font-weight: 800; color: #f472b6;" x-text="avgScore.progress"></div>
            <div style="font-size: var(--text-xs); color: var(--text-secondary);">进步度</div>
          </div>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: var(--text-2xl); font-weight: 800;" x-text="'总分平均: ' + avgScore.total + '分'"></div>
      </div>
    </div>
  </div>

  <script>
    function leaderboardApp() {
      return {
        classId: 1,
        type: 'total',
        loading: true,
        leaderboard: [],
        avgScore: null,
        tierDist: null,
        myName: '',

        init() {
          this.load();
        },

        async load() {
          this.loading = true;
          try {
            // Load scores for tier distribution and average
            if (this.type === 'total') {
              const scoresRes = await fetch(`/api/analysis/scores?class_id=${this.classId}`);
              const scoresData = await scoresRes.json();
              this.avgScore = scoresData.average || null;
              this.tierDist = scoresData.tier_distribution || null;
            }

            // Load leaderboard
            const res = await fetch(`/api/analysis/leaderboard?class_id=${this.classId}&type=${this.type}`);
            const data = await res.json();
            this.leaderboard = data.leaderboard || [];
          } catch (e) {
            console.error('Load failed:', e);
          }
          this.loading = false;
        },

        goProfile(name) {
          window.location.href = `/profile.html?name=${encodeURIComponent(name)}&class_id=${this.classId}`;
        },

        getTierStyle(tierName) {
          const map = {
            '钻石': { background: 'linear-gradient(135deg, rgba(224,64,251,0.15), rgba(0,229,255,0.15))', color: '#a855f7' },
            '铂金': { background: 'linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,128,255,0.15))', color: '#0891b2' },
            '黄金': { background: 'linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,107,53,0.15))', color: '#d97706' },
            '白银': { background: 'linear-gradient(135deg, rgba(232,244,248,0.5), rgba(127,179,213,0.3))', color: '#4a7a9a' },
            '青铜': { background: 'linear-gradient(135deg, rgba(205,127,50,0.15), rgba(184,115,51,0.15))', color: '#a05a2c' },
          };
          const s = map[tierName] || map['青铜'];
          return `background: ${s.background}; color: ${s.color};`;
        },

        getTierPillStyle(tier) {
          if (!tier) return '';
          return `background: ${tier.bg}; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px;`;
        },
      };
    }
  </script>
</body>
</html>
